<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>LDM Slicer: G-code reader test</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>body{background:#000;color:#e8e8e8;font:13px/1.5 "Space Mono",monospace;padding:20px}h1{font-size:16px;color:#00ff00}
td,th{padding:3px 12px;text-align:left;border-bottom:1px solid #222}.ok{color:#00ff00}.bad{color:#ff5a5a}</style></head>
<body><h1>G-code reader test</h1><div id="sum"></div><table id="t"></table>
<script type="module">
import { results } from './gcode-reader.js';
const bad = results.filter(r => !r.ok);
window.__gcode = results;
document.getElementById('sum').innerHTML = `<p class="${bad.length ? 'bad' : 'ok'}">${results.length} checks, ${bad.length} failed</p>`;
document.getElementById('t').innerHTML = results.map(r => `<tr><td>${r.name}</td><td class="${r.ok ? 'ok' : 'bad'}">${r.ok ? 'ok' : r.detail}</td></tr>`).join('');
</script></body></html>
