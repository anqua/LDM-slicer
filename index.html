<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clay Slicer</title>
<style>
:root{
  --bg:#14110e; --panel:#1d1915; --panel2:#262019; --line:#3a3229; --text:#efe7dc;
  --muted:#a2968a; --accent:#d9774b; --accent2:#f0a070; --warn:#e8b04a; --err:#e06a5a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
header{height:52px;display:flex;align-items:center;gap:10px;padding:0 16px;
  border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:650;letter-spacing:.2px;display:flex;align-items:center;gap:8px;margin-right:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 12px;
  cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1a0f08;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.app{display:grid;grid-template-columns:330px 1fr;height:calc(100% - 52px)}
aside{overflow-y:auto;border-right:1px solid var(--line);background:var(--panel)}
.tabs{display:flex;position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:11px 4px;cursor:pointer;color:var(--muted);
  border-bottom:2px solid transparent}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.pane{display:none;padding:6px 14px 24px}
.pane.on{display:block}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:18px 0 8px}
.row{display:grid;grid-template-columns:1fr 112px;align-items:center;gap:8px;margin:6px 0}
.row label{color:var(--text)}
.row small{grid-column:1/-1;color:var(--muted);margin-top:-4px;font-size:12px}
.row input,.row select{width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:5px 7px}
.row .unit{position:relative}
.row .unit span{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--muted);
  font-size:12px;pointer-events:none}
.row .unit input{padding-right:34px}
textarea{width:100%;min-height:110px;background:var(--panel2);border:1px solid var(--line);
  border-radius:6px;padding:7px;font:12px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.btns .btn{padding:5px 10px;font-size:13px}
.info{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
  font-size:13px;color:var(--muted)}
.info b{color:var(--text);font-weight:600}
.warn{color:var(--warn)} .err{color:var(--err)}
main{position:relative;overflow:hidden}
#view{position:absolute;inset:0}
.overlay{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.card{pointer-events:auto;background:rgba(29,25,21,.88);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;font-size:13px;backdrop-filter:blur(4px)}
.viewbtns{position:absolute;right:14px;top:14px;display:flex;gap:6px}
.viewbtns .btn{background:rgba(38,32,25,.9);font-size:13px;padding:5px 10px}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  background:rgba(217,119,75,.12);border:2px dashed var(--accent);font-size:18px;pointer-events:none}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;
  color:var(--muted);text-align:center}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:55% 45%}
  main{order:-1} aside{border-right:0;border-top:1px solid var(--line)}
  header{padding:0 12px;gap:6px} .brand span{display:none}
}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<header>
  <div class="brand"><i></i><span>Clay Slicer</span></div>
  <label class="btn">Open STL<input id="file" type="file" accept=".stl" hidden></label>
  <button class="btn" id="demo">Demo vase</button>
  <div class="spacer"></div>
  <button class="btn primary" id="slice" disabled title="Coming in step 2">Slice</button>
</header>

<div class="app">
  <aside>
    <div class="tabs">
      <button data-tab="model" class="on">Model</button>
      <button data-tab="printer">Printer</button>
      <button data-tab="paths">Print paths</button>
    </div>
    <div class="pane on" id="pane-model"></div>
    <div class="pane" id="pane-printer"></div>
    <div class="pane" id="pane-paths"></div>
  </aside>

  <main>
    <div id="view"></div>
    <div id="empty">Drop an STL file here<br>or use “Open STL” / “Demo vase”</div>
    <div class="overlay"><div class="card" id="status">No model loaded</div></div>
    <div class="viewbtns">
      <button class="btn" data-cam="iso">3D</button>
      <button class="btn" data-cam="top">Top</button>
      <button class="btn" data-cam="front">Front</button>
    </div>
    <div id="drop">Drop STL to load</div>
  </main>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';

/* ------------------------------------------------------------------ *
 *  Settings definition – drives the menus. Later steps read `S`.     *
 * ------------------------------------------------------------------ */
const SCHEMA = {
  printer: [
    { h: 'Machine' },
    { k:'printerName', label:'Printer name', type:'text', def:'My clay printer' },
    { k:'bedX', label:'Bed width (X)', unit:'mm', def:300 },
    { k:'bedY', label:'Bed depth (Y)', unit:'mm', def:300 },
    { k:'bedZ', label:'Max height (Z)', unit:'mm', def:400 },
    { k:'origin', label:'Origin (0,0)', type:'select', def:'corner',
      opts:[['corner','Front-left corner'],['center','Bed center']] },
    { k:'bedShape', label:'Bed shape', type:'select', def:'rect',
      opts:[['rect','Rectangular'],['round','Round (delta)']] },
    { h: 'Extruder' },
    { k:'nozzle', label:'Nozzle diameter', unit:'mm', def:3, step:0.1 },
    { k:'extruderType', label:'Extruder type', type:'select', def:'piston',
      opts:[['piston','Piston / ram'],['auger','Auger / screw'],['pneumatic','Pneumatic']] },
    { k:'eMode', label:'E value meaning', type:'select', def:'filament',
      opts:[['filament','Virtual filament length'],['volumetric','Volume (mm³)']],
      help:'How your firmware interprets the E axis.' },
    { k:'filDia', label:'Virtual filament Ø', unit:'mm', def:1.75, step:0.01,
      help:'Only for "virtual filament". Calibrate with flow %.' },
    { k:'reservoir', label:'Clay capacity', unit:'ml', def:1000,
      help:'Used later to warn if a print needs more clay.' },
    { h: 'Speeds limits' },
    { k:'maxSpeed', label:'Max print speed', unit:'mm/s', def:60 },
    { k:'travelSpeed', label:'Travel speed', unit:'mm/s', def:80 },
    { h: 'G-code' },
    { k:'flavor', label:'Firmware', type:'select', def:'marlin',
      opts:[['marlin','Marlin'],['klipper','Klipper'],['reprap','RepRapFirmware'],['grbl','GRBL']] },
    { k:'startG', label:'Start G-code', type:'area',
      def:'G21 ; millimeters\nG90 ; absolute XYZ\nM83 ; relative E\nG28 ; home all\nG92 E0' },
    { k:'endG', label:'End G-code', type:'area',
      def:'G91\nG1 Z20 F600 ; lift nozzle\nG90\nM84 ; motors off' },
  ],
  paths: [
    { h: 'Layers' },
    { k:'layerH', label:'Layer height', unit:'mm', def:1.8, step:0.1,
      help:'Typically 50–70 % of nozzle diameter for clay.' },
    { k:'lineW', label:'Line width', unit:'mm', def:3.6, step:0.1,
      help:'Typically 110–130 % of nozzle diameter.' },
    { k:'mode', label:'Path mode', type:'select', def:'spiral',
      opts:[['spiral','Spiral vase (continuous)'],['layered','Layer by layer']] },
    { h: 'Walls & bottom' },
    { k:'walls', label:'Wall count', def:1, step:1, help:'Spiral mode always uses 1 wall.' },
    { k:'wallOrder', label:'Wall order', type:'select', def:'outer',
      opts:[['outer','Outer first'],['inner','Inner first']] },
    { k:'bottomLayers', label:'Solid bottom layers', def:3, step:1 },
    { k:'infillAngle', label:'Bottom fill angle', unit:'°', def:45 },
    { k:'seam', label:'Seam position', type:'select', def:'rear',
      opts:[['rear','Aligned at rear'],['nearest','Nearest point'],['random','Random']] },
    { h: 'Extrusion' },
    { k:'flow', label:'Flow', unit:'%', def:100 },
    { k:'retract', label:'Retraction', unit:'mm', def:0, step:0.1, help:'Often 0 for clay.' },
    { k:'zhop', label:'Z-hop on travel', unit:'mm', def:0, step:0.5 },
    { h: 'Speed' },
    { k:'speed', label:'Print speed', unit:'mm/s', def:25 },
    { k:'firstSpeed', label:'First layer speed', unit:'mm/s', def:15 },
    { k:'minLayerTime', label:'Min layer time', unit:'s', def:0,
      help:'Slows small layers so clay can firm up.' },
    { h: 'Priming' },
    { k:'skirtLoops', label:'Skirt loops', def:1, step:1 },
    { k:'skirtDist', label:'Skirt distance', unit:'mm', def:10 },
  ],
  model: [
    { h: 'Transform' },
    { k:'scale', label:'Scale', unit:'%', def:100 },
    { k:'offX', label:'Offset X', unit:'mm', def:0 },
    { k:'offY', label:'Offset Y', unit:'mm', def:0 },
  ],
};

const STORE_KEY = 'claySlicer.settings.v1';
const S = {};
for (const g of Object.values(SCHEMA)) for (const f of g) if (f.k) S[f.k] = f.def;
try { Object.assign(S, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); } catch {}
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch {} };

/* ---------------------------- Menus ---------------------------- */
function buildPane(id, fields, extraTop = '', extraBottom = '') {
  let html = extraTop;
  for (const f of fields) {
    if (f.h) { html += `<h3>${f.h}</h3>`; continue; }
    const id = 'f_' + f.k, help = f.help ? `<small>${f.help}</small>` : '';
    if (f.type === 'area') {
      html += `<div style="margin:8px 0"><label for="${id}">${f.label}</label>
               <textarea id="${id}" spellcheck="false"></textarea></div>`;
      continue;
    }
    let input;
    if (f.type === 'select')
      input = `<select id="${id}">${f.opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select>`;
    else if (f.type === 'text')
      input = `<input id="${id}" type="text">`;
    else
      input = `<div class="unit"><input id="${id}" type="number" step="${f.step ?? 'any'}">${f.unit ? `<span>${f.unit}</span>` : ''}</div>`;
    html += `<div class="row"><label for="${id}">${f.label}</label>${input}${help}</div>`;
  }
  document.getElementById(id).innerHTML = html + extraBottom;
  for (const f of fields) {
    if (!f.k) continue;
    const el = document.getElementById('f_' + f.k);
    el.value = S[f.k];
    el.addEventListener(f.type === 'area' || f.type === 'text' ? 'input' : 'change', () => {
      const v = (f.type && f.type !== 'num') ? el.value : parseFloat(el.value);
      if (typeof v === 'number' && !isFinite(v)) { el.value = S[f.k]; return; }
      S[f.k] = v; save(); onSettingChanged(f.k);
    });
  }
}

buildPane('pane-model', SCHEMA.model,
  `<h3>Model</h3><div class="info" id="modelInfo">No model loaded.</div>`,
  `<h3>Rotate 90°</h3>
   <div class="btns">
     <button class="btn" data-rot="x">↻ X</button>
     <button class="btn" data-rot="y">↻ Y</button>
     <button class="btn" data-rot="z">↻ Z</button>
     <button class="btn" id="resetT">Reset</button>
   </div>
   <h3>Fit</h3>
   <div class="btns">
     <button class="btn" id="fitBed">Scale to fit bed</button>
     <button class="btn" id="centerM">Center</button>
   </div>`);
buildPane('pane-printer', SCHEMA.printer,
  '', `<h3>Presets</h3><div class="btns">
     <button class="btn" id="exportP">Export settings</button>
     <label class="btn">Import settings<input id="importP" type="file" accept=".json" hidden></label>
     <button class="btn" id="resetP">Reset to defaults</button></div>`);
buildPane('pane-paths', SCHEMA.paths,
  `<h3>Suggestions</h3><div class="btns"><button class="btn" id="autoFromNozzle">Set layer & width from nozzle</button></div>`,
  `<h3>Note</h3><div class="info">These settings are saved now and will drive the slicer in step 2.</div>`);

document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('on', p.id === 'pane-' + b.dataset.tab));
});

function setField(k, v) { S[k] = v; const el = document.getElementById('f_' + k); if (el) el.value = v; }

document.getElementById('autoFromNozzle').onclick = () => {
  setField('layerH', +(S.nozzle * 0.6).toFixed(2));
  setField('lineW', +(S.nozzle * 1.2).toFixed(2));
  save(); onSettingChanged('lineW');
};
document.getElementById('exportP').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
  a.download = (S.printerName || 'clay-printer').replace(/[^\w-]+/g, '_') + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
document.getElementById('importP').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { Object.assign(S, JSON.parse(await f.text())); save(); location.reload(); }
  catch { alert('Could not read that settings file.'); }
};
document.getElementById('resetP').onclick = () => {
  if (!confirm('Reset all printer and path settings to defaults?')) return;
  try { localStorage.removeItem(STORE_KEY); } catch {}
  location.reload();
};

/* ---------------------------- 3D scene ---------------------------- */
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14110e);
const camera = new THREE.PerspectiveCamera(40, 1, 1, 20000);
camera.up.set(0, 0, 1);                       // printer convention: Z is up
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0xfff4e6, 0x3a2c22, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-300, -500, 800); scene.add(sun);
const fill = new THREE.DirectionalLight(0xffd9c0, 0.5); fill.position.set(400, 300, 200); scene.add(fill);

const bedGroup = new THREE.Group(); scene.add(bedGroup);
const clayMat = new THREE.MeshStandardMaterial({ color: 0xc97a52, roughness: 0.85, metalness: 0, side: THREE.DoubleSide });
const outMat  = new THREE.MeshStandardMaterial({ color: 0xe06a5a, roughness: 0.85, side: THREE.DoubleSide });
let mesh = null;

function bedRect() {           // bed extents in printer coordinates
  return S.origin === 'center'
    ? { x0: -S.bedX / 2, y0: -S.bedY / 2, x1: S.bedX / 2, y1: S.bedY / 2 }
    : { x0: 0, y0: 0, x1: S.bedX, y1: S.bedY };
}

function buildBed() {
  bedGroup.clear();
  const b = bedRect(), cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  const round = S.bedShape === 'round';
  const plate = round
    ? new THREE.Mesh(new THREE.CircleGeometry(S.bedX / 2, 96), new THREE.MeshStandardMaterial({ color: 0x2a231c, roughness: 1 }))
    : new THREE.Mesh(new THREE.PlaneGeometry(S.bedX, S.bedY), new THREE.MeshStandardMaterial({ color: 0x2a231c, roughness: 1 }));
  plate.position.set(cx, cy, -0.05); bedGroup.add(plate);

  // grid every 10 mm, bolder every 50 mm
  const minor = [], major = [];
  const inBed = (x, y) => !round || Math.hypot(x - cx, y - cy) <= S.bedX / 2 + 1e-6;
  for (let x = Math.ceil(b.x0 / 10) * 10; x <= b.x1; x += 10) {
    let ya = b.y0, yb = b.y1;
    if (round) { const d = Math.sqrt(Math.max(0, (S.bedX / 2) ** 2 - (x - cx) ** 2)); ya = cy - d; yb = cy + d; }
    (x % 50 === 0 ? major : minor).push(x, ya, 0, x, yb, 0);
  }
  for (let y = Math.ceil(b.y0 / 10) * 10; y <= b.y1; y += 10) {
    let xa = b.x0, xb = b.x1;
    if (round) { const d = Math.sqrt(Math.max(0, (S.bedX / 2) ** 2 - (y - cy) ** 2)); xa = cx - d; xb = cx + d; }
    (y % 50 === 0 ? major : minor).push(xa, y, 0, xb, y, 0);
  }
  const lines = (arr, color) => {
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3));
    return new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color }));
  };
  bedGroup.add(lines(minor, 0x3a3128), lines(major, 0x554636));

  // build volume outline
  const vol = round
    ? new THREE.CylinderGeometry(S.bedX / 2, S.bedX / 2, S.bedZ, 64, 1, true).rotateX(Math.PI / 2)
    : new THREE.BoxGeometry(S.bedX, S.bedY, S.bedZ);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(vol, 30),
    new THREE.LineBasicMaterial({ color: 0x4a3f33, transparent: true, opacity: 0.6 }));
  edges.position.set(cx, cy, S.bedZ / 2); bedGroup.add(edges);

  // origin axes
  const ax = new THREE.AxesHelper(30); ax.position.set(0, 0, 0.1); bedGroup.add(ax);
}

/* ---------------------------- Model ---------------------------- */
let baseGeom = null;          // as loaded, centered at origin
let rotM = new THREE.Matrix4();
let modelName = '';

function setModel(geom, name) {
  geom = geom.index ? geom.toNonIndexed() : geom;
  geom.computeBoundingBox();
  const c = new THREE.Vector3(); geom.boundingBox.getCenter(c);
  geom.translate(-c.x, -c.y, -c.z);
  baseGeom = geom; modelName = name; rotM.identity();
  setField('offX', 0); setField('offY', 0); save();
  document.getElementById('empty').style.display = 'none';
  updateModel(true);
}

function updateModel(reframe = false) {
  if (!baseGeom) return;
  const g = baseGeom.clone();
  g.applyMatrix4(rotM);
  const s = S.scale / 100; g.scale(s, s, s);
  g.computeBoundingBox();
  const bb = g.boundingBox, b = bedRect();
  const cx = (b.x0 + b.x1) / 2 + S.offX, cy = (b.y0 + b.y1) / 2 + S.offY;
  g.translate(cx - (bb.min.x + bb.max.x) / 2, cy - (bb.min.y + bb.max.y) / 2, -bb.min.z);
  g.computeVertexNormals(); g.computeBoundingBox();
  if (mesh) { mesh.geometry.dispose(); scene.remove(mesh); }
  mesh = new THREE.Mesh(g, clayMat); scene.add(mesh);
  updateInfo();
  if (reframe) frame('iso');
}

function fits() {
  const bb = mesh.geometry.boundingBox, b = bedRect(), e = 1e-3;
  if (bb.max.z > S.bedZ + e) return false;
  if (S.bedShape === 'round') {
    const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2, p = mesh.geometry.attributes.position.array;
    let r = 0; for (let i = 0; i < p.length; i += 3) r = Math.max(r, Math.hypot(p[i] - cx, p[i + 1] - cy));
    return r <= S.bedX / 2 + e;
  }
  return bb.min.x >= b.x0 - e && bb.max.x <= b.x1 + e && bb.min.y >= b.y0 - e && bb.max.y <= b.y1 + e;
}

function updateInfo() {
  const st = document.getElementById('status'), info = document.getElementById('modelInfo');
  if (!mesh) { st.textContent = 'No model loaded'; return; }
  const bb = mesh.geometry.boundingBox, sz = new THREE.Vector3(); bb.getSize(sz);
  const tris = mesh.geometry.attributes.position.count / 3;
  const ok = fits();
  mesh.material = ok ? clayMat : outMat;
  const layers = Math.round(sz.z / S.layerH);
  const dims = `${sz.x.toFixed(1)} × ${sz.y.toFixed(1)} × ${sz.z.toFixed(1)} mm`;
  info.innerHTML = `<b>${modelName}</b><br>${dims}<br>${tris.toLocaleString()} triangles · ≈${layers} layers at ${S.layerH} mm`
    + (ok ? '' : `<br><span class="err">Model is outside the build volume.</span>`);
  st.innerHTML = `<b>${modelName}</b> · ${dims}` + (ok ? '' : ` · <span class="err">doesn't fit</span>`);
}

function frame(kind) {
  const b = bedRect(), cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
  let tz = 0, r = Math.max(S.bedX, S.bedY) * 0.6;
  if (mesh) { const bb = mesh.geometry.boundingBox; tz = (bb.max.z) / 2; r = Math.max(r, bb.max.z * 0.9); }
  controls.target.set(cx, cy, tz);
  const d = r * 2.4;
  if (kind === 'top') camera.position.set(cx, cy - 0.001, tz + d);
  else if (kind === 'front') camera.position.set(cx, cy - d, tz);
  else camera.position.set(cx + d * 0.55, cy - d * 0.8, tz + d * 0.55);
  controls.update();
}
document.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => frame(b.dataset.cam));

document.querySelectorAll('[data-rot]').forEach(b => b.onclick = () => {
  if (!baseGeom) return;
  const m = new THREE.Matrix4();
  ({ x: () => m.makeRotationX(Math.PI / 2), y: () => m.makeRotationY(Math.PI / 2), z: () => m.makeRotationZ(Math.PI / 2) })[b.dataset.rot]();
  rotM.premultiply(m); updateModel(true);
});
document.getElementById('resetT').onclick = () => {
  rotM.identity(); setField('scale', 100); setField('offX', 0); setField('offY', 0); save(); updateModel(true);
};
document.getElementById('centerM').onclick = () => { setField('offX', 0); setField('offY', 0); save(); updateModel(); };
document.getElementById('fitBed').onclick = () => {
  if (!mesh) return;
  const sz = new THREE.Vector3(); mesh.geometry.boundingBox.getSize(sz);
  const cur = S.scale / 100;
  const lim = S.bedShape === 'round'
    ? Math.min(S.bedX * 0.95 / Math.hypot(sz.x, sz.y), S.bedZ / sz.z)
    : Math.min(S.bedX * 0.95 / sz.x, S.bedY * 0.95 / sz.y, S.bedZ / sz.z);
  setField('scale', Math.floor(cur * lim * 1000) / 10); setField('offX', 0); setField('offY', 0);
  save(); updateModel(true);
};

function onSettingChanged(k) {
  if (['bedX', 'bedY', 'bedZ', 'origin', 'bedShape'].includes(k)) { buildBed(); updateModel(); }
  else if (['scale', 'offX', 'offY'].includes(k)) updateModel();
  else updateInfo();
}

/* ---------------------------- Loading ---------------------------- */
const loader = new STLLoader();
async function loadFile(file) {
  if (!/\.stl$/i.test(file.name)) { alert('Please choose an .stl file.'); return; }
  try { setModel(loader.parse(await file.arrayBuffer()), file.name); }
  catch (e) { alert('Could not read this STL: ' + e.message); }
}
document.getElementById('file').onchange = e => { if (e.target.files[0]) loadFile(e.target.files[0]); e.target.value = ''; };
const dropEl = document.getElementById('drop');
addEventListener('dragover', e => { e.preventDefault(); dropEl.style.display = 'flex'; });
addEventListener('dragleave', e => { if (!e.relatedTarget) dropEl.style.display = 'none'; });
addEventListener('drop', e => { e.preventDefault(); dropEl.style.display = 'none'; const f = e.dataTransfer.files[0]; if (f) loadFile(f); });

// Procedural demo: a wavy, slightly twisted vase (closed, watertight mesh)
function demoVase() {
  const H = 180, N = 120, R = 90, pos = [], idx = [];
  const rad = (z, t) => 45 + 18 * Math.sin(z / H * Math.PI * 1.15 + 0.3) + 3.5 * Math.sin(8 * t + z * 0.035);
  for (let j = 0; j <= R; j++) {
    const z = j / R * H;
    for (let i = 0; i < N; i++) { const t = i / N * Math.PI * 2, r = rad(z, t); pos.push(r * Math.cos(t), r * Math.sin(t), z); }
  }
  for (let j = 0; j < R; j++) for (let i = 0; i < N; i++) {
    const a = j * N + i, b = j * N + (i + 1) % N, c = a + N, d = b + N; idx.push(a, b, d, a, d, c);
  }
  const bot = pos.length / 3; pos.push(0, 0, 0); const top = bot + 1; pos.push(0, 0, H);
  for (let i = 0; i < N; i++) { idx.push(bot, (i + 1) % N, i); idx.push(top, R * N + i, R * N + (i + 1) % N); }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(idx);
  setModel(g, 'demo-vase.stl');
}
document.getElementById('demo').onclick = demoVase;

/* ---------------------------- Render loop ---------------------------- */
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%';
  camera.aspect = w / Math.max(h, 1); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(view);
buildBed(); resize(); frame('iso');
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
