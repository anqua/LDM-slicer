<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LDM Slicer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module" src="src/main.js"></script>
</head>
<body>
<header>
  <div class="brand"><i></i><span>LDM Slicer</span></div>
  <label class="btn">Open STL<input id="file" type="file" accept=".stl" hidden></label>
  <button class="btn" id="demo">Demo vase</button>
  <div class="spacer"></div>
  <button class="btn primary" id="slice" disabled title="Coming in step 2">Slice</button>
</header>

<div class="app">
  <aside>
    <div class="tabs">
      <button data-tab="model" class="on">Model</button>
      <button data-tab="printer">Printer</button>
      <button data-tab="paths">Print paths</button>
    </div>
    <div class="pane on" id="pane-model"></div>
    <div class="pane" id="pane-printer"></div>
    <div class="pane" id="pane-paths"></div>
  </aside>

  <main>
    <div id="view"></div>
    <div id="empty">Drop an STL file here<br>or use “Open STL” / “Demo vase”</div>
    <div class="overlay"><div class="card" id="status">No model loaded</div></div>
    <div class="viewbtns">
      <button class="btn" id="printerBtn" title="Show printer (P)">Printer</button>
      <button class="btn" id="proj" title="Toggle projection (O)">Perspective</button>
      <button class="btn" data-cam="iso">3D</button>
      <button class="btn" data-cam="top">Top</button>
      <button class="btn" data-cam="front">Front</button>
    </div>
    <div id="drop">Drop STL to load</div>
  </main>
</div>
</body>
</html>
